name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: exa-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install package managers and EAS CLI
        run: npm install --global pnpm@11.25.0 eas-cli@24.12.1

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'Configure GitHub Actions secret EXPO_TOKEN.'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Configure repository variable EXPO_PUBLIC_SUPABASE_URL.'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Configure repository variable EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY.'; exit 1; }
          test -n "$EXPO_PUBLIC_APP_URL" || { echo 'Configure repository variable EXPO_PUBLIC_APP_URL after the Vercel domain is known.'; exit 1; }

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @exa/mobile exec expo export --platform android

      - name: Initialize or link EAS project
        working-directory: apps/mobile
        run: eas project:init --account achilles33 --non-interactive

      - name: Synchronize public Expo build variables
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas env:set production --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --visibility plaintext --non-interactive
          eas env:set production --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY --value "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" --visibility plaintext --non-interactive
          eas env:set production --name EXPO_PUBLIC_APP_URL --value "$EXPO_PUBLIC_APP_URL" --visibility plaintext --non-interactive

      - name: Build APK on EAS
        id: build_eas
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile production-apk --non-interactive --wait --json > "$RUNNER_TEMP/exa-eas-build.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/exa-eas-build.json', 'utf8'));
          const builds = Array.isArray(result) ? result : [result];
          const build = builds.find(item => String(item.platform).toUpperCase() === 'ANDROID');
          if (!build || typeof build.id !== 'string') {
            throw new Error('EAS did not return the Android build ID.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'build_id=' + build.id + '\n');
          console.log('Android EAS build ID: ' + build.id);
          NODE

      - name: Download APK from EAS
        working-directory: apps/mobile
        shell: bash
        env:
          EAS_BUILD_ID: ${{ steps.build_eas.outputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$EAS_BUILD_ID" || { echo 'Missing EAS build ID.'; exit 1; }
          eas build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/exa-eas-build-detail.json"
          apk_url="$(node - <<'NODE'
          const fs = require('node:fs');
          const build = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/exa-eas-build-detail.json', 'utf8'));
          if (String(build.status).toUpperCase() !== 'FINISHED') {
            throw new Error('EAS build has not finished successfully: ' + build.status);
          }
          const url = build.artifacts?.buildUrl || build.artifacts?.applicationArchiveUrl;
          if (!url || new URL(url).protocol !== 'https:') {
            throw new Error('EAS build did not provide a valid HTTPS APK URL.');
          }
          process.stdout.write(url);
          NODE
          )"
          mkdir -p artifacts
          curl --fail --location --retry 3 --silent --show-error --output artifacts/EXA-Android.apk "$apk_url"
          unzip -tqq artifacts/EXA-Android.apk
          sha256sum artifacts/EXA-Android.apk

      - name: Verify Android signature, package and alignment
        shell: bash
        run: |
          set -euo pipefail
          android_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$android_tools/apksigner"
          apk_path="apps/mobile/artifacts/EXA-Android.apk"
          "$android_tools/apksigner" verify --verbose --print-certs "$apk_path"
          "$android_tools/zipalign" -c -P 16 4 "$apk_path"
          "$android_tools/aapt" dump badging "$apk_path" > "$RUNNER_TEMP/exa-apk-badging.txt"
          grep -F "package: name='com.exa.dashboard'" "$RUNNER_TEMP/exa-apk-badging.txt"
          grep "native-code:.*arm64-v8a" "$RUNNER_TEMP/exa-apk-badging.txt"
          if "$android_tools/aapt" dump xmltree "$apk_path" AndroidManifest.xml | grep -E 'android:debuggable.*0xffffffff'; then
            echo 'Release APK must not be debuggable.'; exit 1
          fi
          sha256sum "$apk_path" > apps/mobile/artifacts/EXA-Android.apk.sha256

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exa-android-apk
          path: |
            apps/mobile/artifacts/EXA-Android.apk
            apps/mobile/artifacts/EXA-Android.apk.sha256
          if-no-files-found: error
          retention-days: 14
