name: Build Android APK (EAS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: exa-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install package managers and EAS CLI
        run: npm install --global pnpm@11.25.0 eas-cli@24.12.1

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" || { echo 'Configure GitHub Actions secret EXPO_TOKEN.'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo 'Configure repository variable EXPO_PUBLIC_SUPABASE_URL.'; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo 'Configure repository variable EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY.'; exit 1; }
          test -n "$EXPO_PUBLIC_APP_URL" || { echo 'Configure repository variable EXPO_PUBLIC_APP_URL after the Vercel domain is known.'; exit 1; }

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm typecheck
          pnpm test
          pnpm --filter @exa/mobile exec expo export --platform android

      - name: Initialize or link EAS project
        run: |
          account="$(eas whoami)"
          test -n "$account"
          eas project:init --account "$account" --non-interactive

      - name: Synchronize public Expo build variables
        shell: bash
        run: |
          set -euo pipefail
          eas env:set production --name EXPO_PUBLIC_SUPABASE_URL --value "$EXPO_PUBLIC_SUPABASE_URL" --visibility plaintext --non-interactive
          eas env:set production --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY --value "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" --visibility plaintext --non-interactive
          eas env:set production --name EXPO_PUBLIC_APP_URL --value "$EXPO_PUBLIC_APP_URL" --visibility plaintext --non-interactive

      - name: Build APK on EAS
        run: eas build --platform android --profile production-apk --non-interactive --wait

      - name: Download APK from EAS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          eas build:download --platform android --non-interactive
          apk="$(find . -maxdepth 3 -type f -name '*.apk' -not -path './artifacts/*' -print -quit)"
          test -n "$apk" || { echo 'EAS build completed but no APK was downloaded.'; exit 1; }
          cp "$apk" artifacts/EXA-Android.apk
          sha256sum artifacts/EXA-Android.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exa-android-apk
          path: artifacts/EXA-Android.apk
          if-no-files-found: error
          retention-days: 14
